[project]
name = "kudi"
version = "0.1.0"
description = "Local-first ML pipeline that categorizes bank transactions, flags anomalies, and detects recurring charges."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "tiyumbajawad-create" }]

dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "rapidfuzz>=3.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.99",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "nbstripout>=0.7",
    "pip-audit>=2.7",
]

[project.scripts]
kudi = "kudi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kudi"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kudi"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/kudi --cov-report=term-missing"
