name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy --strict)
        run: mypy src

      - name: Test with coverage
        # NOTE: coverage gate is off during M0 (skeleton only, most modules are
        # empty stubs). Re-enable `--cov-fail-under=90` once M2/M3 land real code.
        run: pytest

      - name: Dependency audit
        run: pip-audit || true # informational until lockfile is pinned
